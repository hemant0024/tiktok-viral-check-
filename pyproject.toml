[project]
name = "creative-intelligence"
version = "0.1.0"
description = "Daily Creative Intelligence System"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.7",
  "tenacity>=8.3",
  "google-api-python-client>=2.130",
  "gspread>=6.1",
  "google-auth>=2.30",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: no network, no API keys",
  "integration: needs .env and live services",
]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
